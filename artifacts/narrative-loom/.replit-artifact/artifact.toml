kind = "web"
previewPath = "/"
title = "Narrative Loom"
version = "1.0.0"
id = "artifacts/narrative-loom"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19889

[services.development]
run = "pnpm --filter @workspace/narrative-loom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/narrative-loom", "run", "build" ]
publicDir = "artifacts/narrative-loom/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19889"
BASE_PATH = "/"
